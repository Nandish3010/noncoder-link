<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Non-Coder</title>
<meta name="description" content="I can't code. I build anyway — with AI. Showing normal people how to build real things with AI agents, no coding.">
<meta property="og:type" content="website">
<meta property="og:title" content="The Non-Coder">
<meta property="og:description" content="I can't code. I build anyway — with AI.">
<meta property="og:url" content="https://noncoder.unchurned.co">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5a36'/%3E%3Cpath d='M26 20 14 32l12 12M38 20l12 12-12 12' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12 52 52 12' stroke='%23111' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --fg:#16181d; --muted:#5d6068; --card:#ffffff; --line:#16181d;
  --accent:#ff5a36; --accent-fg:#ffffff; --badge-bg:#16181d; --badge-fg:#f6f3ec;
  --shadow:#16181d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --fg:#f2efe8; --muted:#9a9ca5; --card:#181b21; --line:#f2efe8;
    --accent:#ff7a59; --accent-fg:#0f1115; --badge-bg:#f2efe8; --badge-fg:#0f1115;
    --shadow:#ff7a59;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.4; min-height:100vh; overflow-x:hidden;
}
.wrap{max-width:480px; margin:0 auto; padding:48px 16px 32px}
header{text-align:center; margin-bottom:32px}
.mark{width:96px; height:96px; margin:0 auto 20px; display:block}
.mark .box{fill:var(--accent)}
.mark .code{stroke:var(--accent-fg); fill:none}
.mark .slash{stroke:var(--fg)}
h1{
  font-family:"Space Grotesk",system-ui,sans-serif; font-weight:700;
  font-size:2rem; letter-spacing:-.02em; margin:0 0 8px;
}
.tag{margin:0; color:var(--muted); font-size:1.05rem}
.tag b{color:var(--fg); font-weight:700}
nav{display:flex; flex-direction:column; gap:14px}
.btn{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  min-height:60px; padding:14px 18px; text-decoration:none; color:var(--fg);
  background:var(--card); border:2px solid var(--line); border-radius:16px;
  box-shadow:4px 4px 0 var(--shadow);
  font-weight:700; font-size:1.02rem;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover,.btn:focus-visible{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--shadow); outline:none}
.btn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--shadow)}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.btn.primary{background:var(--accent); color:var(--accent-fg)}
.badge{
  flex:none; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  background:var(--badge-bg); color:var(--badge-fg); padding:4px 9px; border-radius:999px;
}
.arrow{flex:none; font-family:"Space Grotesk",sans-serif; font-size:1.2rem}
footer{margin-top:40px; text-align:center; color:var(--muted); font-size:.85rem}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 96 96" role="img" aria-label="Crossed-out code brackets logo">
      <rect class="box" x="4" y="4" width="88" height="88" rx="24"/>
      <path class="code" d="M38 30 20 48l18 18M58 30l18 18-18 18" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="slash" d="M16 82 80 14" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <h1>The Non-Coder</h1>
    <p class="tag">I can't code. <b>I build anyway — with AI.</b></p>
  </header>

  <nav aria-label="Links">
    <a class="btn primary" href="#"><span>Free: 10 prompts to build with AI (coming soon)</span><span class="badge">Soon</span></a>
    <a class="btn" href="https://shop.unchurned.co"><span>Shop templates &amp; workflows</span><span class="badge">Soon</span></a>
    <a class="btn" href="https://www.instagram.com/noncoderhq/" rel="noopener"><span>Instagram</span><span class="arrow" aria-hidden="true">&rarr;</span></a>
    <a class="btn" href="https://www.youtube.com/@noncoderhq" rel="noopener"><span>YouTube</span><span class="arrow" aria-hidden="true">&rarr;</span></a>
    <a class="btn" href="mailto:hello@unchurned.co"><span>Email</span><span class="arrow" aria-hidden="true">&rarr;</span></a>
  </nav>

  <footer>&copy; 2026 The Non-Coder &middot; unchurned.co</footer>
</main>
</body>
</html>
