name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # 2026-11-26: deploy-pages sometimes can't see the just-uploaded artifact yet
      # ("No artifacts named github-pages"); a re-run works, so retry once after a pause.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
